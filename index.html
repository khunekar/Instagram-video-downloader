<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divine Place — Laddu Bill</title>
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #F0DC9A;
    --cream: #FDF8F0;
    --dark: #1A1209;
    --brown: #3D2B0E;
    --brown-light: #7A5C2E;
    --white: #FFFFFF;
    --green: #1a7a4a;
    --red: #c0392b;
    --border: rgba(201,168,76,0.2);
    --shadow: 0 4px 24px rgba(26,18,9,0.10);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system,'Segoe UI',sans-serif;
    background: var(--cream);
    min-height: 100vh;
    padding-bottom: 60px;
  }
  header {
    background: var(--dark);
    padding: 20px 24px;
    text-align: center;
    border-bottom: 3px solid var(--gold);
  }
  header .logo { display:block; margin:0 auto 8px; width:64px; height:64px; }
  header .emoji { font-size:32px; display:block; margin-bottom:4px; }
  header h1 { color:var(--gold); font-size:22px; font-weight:700; }
  header p { color:rgba(201,168,76,0.55); font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-top:3px; }

  .wrap { max-width:680px; margin:0 auto; padding:24px 16px; }

  .card {
    background:var(--white);
    border-radius:16px;
    padding:24px;
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    margin-bottom:20px;
  }
  .card-title {
    font-size:13px; font-weight:700; letter-spacing:1.8px;
    text-transform:uppercase; color:var(--brown-light);
    margin-bottom:18px; padding-bottom:12px;
    border-bottom:1px solid var(--cream);
  }

  .row { display:flex; gap:14px; margin-bottom:14px; }
  .row .fg { flex:1; }
  .fg { margin-bottom:14px; }
  .fg:last-child { margin-bottom:0; }
  label {
    display:block; font-size:11px; font-weight:600;
    letter-spacing:1.2px; text-transform:uppercase;
    color:var(--brown-light); margin-bottom:6px;
  }
  input {
    width:100%; padding:12px 14px;
    border:2px solid var(--border); border-radius:10px;
    font-size:15px; font-family:inherit; color:var(--dark);
    background:var(--cream); outline:none;
    transition:border 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color:var(--gold); background:var(--white);
    box-shadow:0 0 0 3px rgba(201,168,76,0.12);
  }
  input::placeholder { color:#C4B499; }

  .items-head {
    display:grid;
    grid-template-columns:2.5fr 1fr 1.2fr 1.2fr 36px;
    gap:8px; background:var(--dark); border-radius:8px;
    padding:10px 12px; margin-bottom:8px;
  }
  .items-head span {
    font-size:10px; font-weight:700; letter-spacing:1.2px;
    text-transform:uppercase; color:var(--gold);
  }
  .item-row {
    display:grid;
    grid-template-columns:2.5fr 1fr 1.2fr 1.2fr 36px;
    gap:8px; align-items:center; padding:6px 0;
    border-bottom:1px dashed rgba(201,168,76,0.15);
  }
  .item-row input { padding:10px; font-size:14px; }
  .item-total { font-size:14px; font-weight:700; color:var(--brown); text-align:right; padding-right:4px; }
  .btn-remove {
    background:none; border:none; color:var(--red);
    font-size:18px; cursor:pointer; padding:4px;
    border-radius:6px; transition:background 0.15s;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-remove:hover { background:rgba(192,57,43,0.08); }
  .btn-add {
    margin-top:14px; background:none; border:2px dashed var(--gold);
    color:var(--gold); font-size:13px; font-weight:600;
    padding:10px 20px; border-radius:10px; cursor:pointer;
    width:100%; letter-spacing:0.5px; transition:all 0.2s;
  }
  .btn-add:hover { background:rgba(201,168,76,0.07); }

  .summary-row {
    display:flex; justify-content:space-between;
    align-items:center; padding:10px 0;
    border-bottom:1px solid var(--cream);
  }
  .summary-row:last-child { border-bottom:none; }
  .summary-label { font-size:14px; color:var(--brown-light); font-weight:500; }
  .summary-value { font-size:16px; font-weight:700; color:var(--dark); }

  .total-bar {
    background:var(--dark); border-radius:12px;
    padding:16px 20px; display:flex;
    justify-content:space-between; align-items:center; margin-top:12px;
  }
  .total-bar span:first-child { color:rgba(255,255,255,0.7); font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase; }
  .total-bar span:last-child { color:var(--gold); font-size:24px; font-weight:700; }

  .pending-bar {
    border-radius:12px; padding:14px 20px;
    display:flex; justify-content:space-between;
    align-items:center; margin-top:10px;
  }
  .pending-bar.has-pending { background:rgba(192,57,43,0.07); border:1.5px solid rgba(192,57,43,0.2); }
  .pending-bar.all-paid { background:rgba(26,122,74,0.07); border:1.5px solid rgba(26,122,74,0.2); }
  .pending-bar span:first-child { font-size:13px; font-weight:600; }
  .pending-bar.has-pending span:first-child { color:var(--red); }
  .pending-bar.all-paid span:first-child { color:var(--green); }
  .pending-bar span:last-child { font-size:20px; font-weight:700; }
  .pending-bar.has-pending span:last-child { color:var(--red); }
  .pending-bar.all-paid span:last-child { color:var(--green); }

  .paid-input-wrap { padding:12px 0; }

  .wa-section {
    background:var(--white); border-radius:16px;
    padding:24px; box-shadow:var(--shadow);
    border:1.5px solid #25D366;
  }
  .wa-title {
    display:flex; align-items:center; gap:10px;
    font-size:16px; font-weight:700; color:#1a7a4a; margin-bottom:16px;
  }
  .wa-input-wrap { display:flex; gap:10px; align-items:flex-end; }
  .wa-input-wrap .fg { flex:1; margin:0; }
  .btn-send {
    background:#25D366; color:white; border:none;
    border-radius:10px; padding:13px 20px; font-size:14px;
    font-weight:700; cursor:pointer; white-space:nowrap;
    transition:background 0.2s, transform 0.1s;
    display:flex; align-items:center; gap:6px;
    font-family:inherit;
  }
  .btn-send:hover { background:#1fa851; }
  .btn-send:active { transform:scale(0.97); }

  .bill-preview {
    background:var(--cream); border:1px dashed var(--gold);
    border-radius:10px; padding:16px; margin-top:16px;
    font-size:12px; color:var(--brown); white-space:pre-wrap;
    font-family:'Courier New',monospace; line-height:1.7; display:none;
  }
  .bill-preview.show { display:block; }

  @media(max-width:480px){
    .row { flex-direction:column; gap:0; }
    .items-head { grid-template-columns:1.8fr 0.7fr 1fr 1fr 28px; gap:4px; padding:8px; }
    .item-row { grid-template-columns:1.8fr 0.7fr 1fr 1fr 28px; gap:4px; }
    .items-head span { font-size:9px; }
    .item-row input { padding:8px 6px; font-size:13px; }
    .item-total { font-size:13px; }
    header h1 { font-size:18px; }
    .wa-input-wrap { flex-direction:column; }
    .btn-send { width:100%; justify-content:center; }
  }
</style>
</head>
<body>

<header>
  <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
    <!-- Laddu base ball -->
    <circle cx="32" cy="35" r="22" fill="#C9A84C"/>
    <circle cx="32" cy="35" r="22" fill="url(#ladduGrad)"/>
    <!-- Shine -->
    <ellipse cx="24" cy="24" rx="6" ry="4" fill="rgba(255,255,255,0.18)" transform="rotate(-30 24 24)"/>
    <!-- Dry fruit dots on laddu -->
    <circle cx="26" cy="30" r="2.2" fill="#7A3B00"/>
    <circle cx="34" cy="26" r="1.8" fill="#4a7c00"/>
    <circle cx="38" cy="34" r="2" fill="#8B1a00"/>
    <circle cx="28" cy="38" r="1.8" fill="#7A3B00"/>
    <circle cx="36" cy="42" r="1.6" fill="#4a7c00"/>
    <circle cx="22" cy="40" r="2" fill="#8B5a00"/>
    <circle cx="32" cy="32" r="1.5" fill="#8B1a00"/>
    <!-- Top decoration / garnish -->
    <ellipse cx="32" cy="14" rx="6" ry="4" fill="#C9A84C" opacity="0.7"/>
    <circle cx="32" cy="11" r="3.5" fill="#E8C97A"/>
    <circle cx="32" cy="11" r="2" fill="#C9A84C"/>
    <!-- Silver leaf decoration -->
    <ellipse cx="25" cy="13" rx="3" ry="1.5" fill="silver" opacity="0.7" transform="rotate(-30 25 13)"/>
    <ellipse cx="39" cy="13" rx="3" ry="1.5" fill="silver" opacity="0.7" transform="rotate(30 39 13)"/>
    <defs>
      <radialGradient id="ladduGrad" cx="38%" cy="32%" r="60%">
        <stop offset="0%" stop-color="#F0DC9A"/>
        <stop offset="50%" stop-color="#C9A84C"/>
        <stop offset="100%" stop-color="#8B6000"/>
      </radialGradient>
    </defs>
  </svg>
  <h1>Divine Place Dry Fruit Laddu</h1>
  <p>Bill Calculator</p>
</header>

<div class="wrap">

  <!-- CUSTOMER -->
  <div class="card">
    <div class="card-title">👤 Customer Details</div>
    <div class="row">
      <div class="fg">
        <label>Customer Name</label>
        <input type="text" id="custName" placeholder="Enter name" oninput="updateBill()">
      </div>
      <div class="fg">
        <label>Date</label>
        <input type="date" id="billDate" oninput="updateBill()">
      </div>
    </div>
    <div class="row">
      <div class="fg">
        <label>Bill No.</label>
        <input type="text" id="billNo" placeholder="e.g. 001" oninput="updateBill()">
      </div>
      <div class="fg">
        <label>Customer Phone</label>
        <input type="tel" id="custPhone" placeholder="Phone number" oninput="updateBill()">
      </div>
    </div>
  </div>

  <!-- ITEMS -->
  <div class="card">
    <div class="card-title">📦 Items</div>
    <div class="items-head">
      <span>Item Name</span>
      <span>Qty</span>
      <span>Price/Box</span>
      <span>Total</span>
      <span></span>
    </div>
    <div id="itemsContainer"></div>
    <button class="btn-add" onclick="addItem()">＋ Add Item</button>
  </div>

  <!-- PAYMENT -->
  <div class="card">
    <div class="card-title">💰 Payment Summary</div>
    <div class="summary-row">
      <span class="summary-label">Subtotal</span>
      <span class="summary-value" id="subtotalDisplay">₹0</span>
    </div>
    <div class="paid-input-wrap">
      <label>Amount Received (₹)</label>
      <input type="number" id="amountPaid" placeholder="0" min="0" oninput="updateBill()">
    </div>
    <div class="total-bar">
      <span>Total Amount</span>
      <span id="totalDisplay">₹0</span>
    </div>
    <div class="pending-bar has-pending" id="pendingBar">
      <span id="pendingLabel">⚠️ Pending</span>
      <span id="pendingDisplay">₹0</span>
    </div>
  </div>

  <!-- WHATSAPP -->
  <div class="wa-section">
    <div class="wa-title">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#25D366">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Send Bill on WhatsApp
    </div>
    <div class="wa-input-wrap">
      <div class="fg">
        <label>WhatsApp Number (with country code)</label>
        <input type="tel" id="waNumber" placeholder="91XXXXXXXXXX" oninput="updateBill()">
      </div>
      <button class="btn-send" onclick="sendWhatsApp()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Send Bill
      </button>
    </div>
    <div class="bill-preview" id="billPreview"></div>
  </div>

</div>

<script>
  // Set today's date
  document.getElementById('billDate').value = new Date().toISOString().split('T')[0];

  let items = [];

  function addItem(name, qty, price) {
    const id = Date.now() + Math.random();
    items.push({ id, name: name||'', qty: qty||'', price: price||'' });
    renderItems();
    updateBill();
  }

  function removeItem(id) {
    items = items.filter(i => i.id !== id);
    renderItems();
    updateBill();
  }

  function renderItems() {
    const c = document.getElementById('itemsContainer');
    c.innerHTML = '';
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row';
      const t = parseFloat(item.qty||0) * parseFloat(item.price||0);
      row.innerHTML =
        '<input type="text" placeholder="Dry Fruit Laddu Box" value="' + escHtml(item.name) + '" oninput="setItem(' + item.id + ',\'name\',this.value)">' +
        '<input type="number" placeholder="1" min="1" value="' + escHtml(item.qty) + '" oninput="setItem(' + item.id + ',\'qty\',this.value)">' +
        '<input type="number" placeholder="95" min="0" value="' + escHtml(item.price) + '" oninput="setItem(' + item.id + ',\'price\',this.value)">' +
        '<div class="item-total" id="row-' + item.id + '">₹' + (t||0).toFixed(0) + '</div>' +
        '<button class="btn-remove" onclick="removeItem(' + item.id + ')">✕</button>';
      c.appendChild(row);
    });
  }

  function escHtml(v) {
    return String(v||'').replace(/"/g,'&quot;');
  }

  function setItem(id, field, val) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    item[field] = val;
    const t = parseFloat(item.qty||0) * parseFloat(item.price||0);
    const el = document.getElementById('row-' + id);
    if (el) el.textContent = '₹' + (t||0).toFixed(0);
    updateBill();
  }

  // Default first item
  addItem('Dry Fruit Laddu Box', '', '95');

  function updateBill() {
    let subtotal = 0;
    items.forEach(item => {
      subtotal += parseFloat(item.qty||0) * parseFloat(item.price||0);
    });

    const paid = parseFloat(document.getElementById('amountPaid').value||0);
    const pending = subtotal - paid;

    document.getElementById('subtotalDisplay').textContent = '₹' + subtotal.toFixed(0);
    document.getElementById('totalDisplay').textContent = '₹' + subtotal.toFixed(0);

    const bar = document.getElementById('pendingBar');
    const lbl = document.getElementById('pendingLabel');
    const disp = document.getElementById('pendingDisplay');

    if (pending <= 0 && subtotal > 0) {
      bar.className = 'pending-bar all-paid';
      lbl.textContent = '✅ Fully Paid';
      disp.textContent = '₹0';
    } else {
      bar.className = 'pending-bar has-pending';
      lbl.textContent = '⚠️ Pending';
      disp.textContent = '₹' + (pending < 0 ? 0 : pending).toFixed(0);
    }

    // Show preview if WA number typed
    const waNum = document.getElementById('waNumber').value.trim();
    const preview = document.getElementById('billPreview');
    if (waNum.length >= 5) {
      preview.textContent = generateBillText(subtotal, paid, pending);
      preview.classList.add('show');
    } else {
      preview.classList.remove('show');
    }
  }

  function formatDate(d) {
    if (!d) return '';
    const [y,m,dd] = d.split('-');
    return dd + '/' + m + '/' + y;
  }

  function generateBillText(subtotal, paid, pending) {
    const name   = document.getElementById('custName').value  || 'Customer';
    const date   = document.getElementById('billDate').value;
    const billNo = document.getElementById('billNo').value     || '-';
    const phone  = document.getElementById('custPhone').value;

    const thick  = '▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬';
    const thin   = '─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─';

    let txt = '';

    // ── HEADER ──
    txt += thick + '\n';
    txt += '🫓  *DIVINE PLACE*\n';
    txt += '✨  *DRY FRUIT LADDU*\n';
    txt += '     _Premium Quality | 100% Natural_\n';
    txt += thick + '\n\n';

    // ── INVOICE INFO ──
    txt += '🧾  *INVOICE*\n';
    txt += thin + '\n';
    txt += '📋  Bill No    :  *#' + billNo + '*\n';
    txt += '📅  Date         :  ' + formatDate(date) + '\n';
    txt += thin + '\n\n';

    // ── CUSTOMER ──
    txt += '👤  *CUSTOMER DETAILS*\n';
    txt += thin + '\n';
    txt += '🙍  Name       :  *' + name + '*\n';
    if (phone) txt += '📞  Phone      :  ' + phone + '\n';
    txt += thin + '\n\n';

    // ── ITEMS ──
    txt += '📦  *ORDER ITEMS*\n';
    txt += thin + '\n';

    let hasItems = false;
    let srNo = 1;
    items.forEach(item => {
      if (item.qty && item.price && parseFloat(item.qty) > 0) {
        hasItems = true;
        const t = parseFloat(item.qty) * parseFloat(item.price);
        const nm = item.name || 'Dry Fruit Laddu Box';
        txt += srNo + '.  *' + nm + '*\n';
        txt += '     ' + item.qty + ' box  ×  ₹' + parseFloat(item.price).toFixed(0) + '  =  *₹' + t.toFixed(0) + '*\n';
        srNo++;
      }
    });

    if (!hasItems) txt += '     _(No items added)_\n';
    txt += thin + '\n\n';

    // ── PAYMENT ──
    txt += '💳  *PAYMENT SUMMARY*\n';
    txt += thin + '\n';
    txt += '💰  Total Amount  :  *₹' + subtotal.toFixed(0) + '*\n';
    txt += '✅  Received        :  ₹' + paid.toFixed(0) + '\n';

    const p = pending < 0 ? 0 : pending;
    if (p > 0) {
      txt += '⚠️  *Pending          :  ₹' + p.toFixed(0) + '*\n';
    } else {
      txt += '🎉  *Status             :  FULLY PAID ✔*\n';
    }
    txt += thin + '\n\n';

    // ── FOOTER ──
    txt += thick + '\n';
    txt += '🙏  _Thank you for choosing us!_\n';
    txt += '🥜  _Every laddu is made with love_\n';
    txt += '     _& 100% pure ingredients._\n\n';
    txt += '📍  *Divine Place Dry Fruit Laddu*\n';
    txt += '     _Ganesh Nagar, Telangana_\n';
    txt += thick;

    return txt;
  }

  function sendWhatsApp() {
    const raw = document.getElementById('waNumber').value.trim().replace(/\D/g,'');
    if (!raw || raw.length < 10) {
      alert('Please enter a valid WhatsApp number.\nExample: 919876543210 (91 + 10 digit number)');
      return;
    }
    let subtotal = 0;
    items.forEach(item => { subtotal += parseFloat(item.qty||0) * parseFloat(item.price||0); });
    const paid = parseFloat(document.getElementById('amountPaid').value||0);
    const pending = subtotal - paid;
    const txt = generateBillText(subtotal, paid, pending);
    window.open('https://wa.me/' + raw + '?text=' + encodeURIComponent(txt), '_blank');
  }
</script>
</body>
</html>
