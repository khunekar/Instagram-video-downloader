<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IG Video Downloader</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(255,0,102,0.13) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(131,58,180,0.13) 0%, transparent 55%),
        #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Sora', sans-serif;
      color: #fff;
      padding: 32px 16px;
    }

    .header { display:flex; align-items:center; gap:16px; margin-bottom:36px; }
    .ig-logo {
      width:56px; height:56px; border-radius:16px; font-size:28px;
      background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
      display:flex; align-items:center; justify-content:center;
      box-shadow: 0 0 32px rgba(220,39,67,.4), 0 0 64px rgba(188,24,136,.2);
    }
    .header h1 { font-size:24px; font-weight:800; letter-spacing:-.03em; }
    .header p  { font-size:13px; color:rgba(255,255,255,.35); font-family:'DM Sans',sans-serif; margin-top:3px; }

    .card {
      width:100%; max-width:560px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.09);
      border-radius:24px;
      padding:38px 36px;
      box-shadow: 0 24px 80px rgba(0,0,0,.5);
      backdrop-filter:blur(20px);
    }

    .label { font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:10px; }

    .input-row { display:flex; gap:10px; }
    .input-row input {
      flex:1; background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.11);
      border-radius:12px; outline:none; color:#fff;
      font-size:14px; font-family:'DM Sans',sans-serif;
      padding:15px 18px; transition:border-color .2s, box-shadow .2s;
    }
    .input-row input:focus { border-color:rgba(220,39,67,.65); box-shadow:0 0 0 3px rgba(220,39,67,.1); }
    .input-row input::placeholder { color:rgba(255,255,255,.28); }

    .fetch-btn {
      padding:15px 22px;
      background: linear-gradient(135deg,#f09433,#dc2743,#bc1888);
      border:none; border-radius:12px; color:#fff;
      font-family:'Sora',sans-serif; font-weight:700; font-size:14px;
      cursor:pointer; white-space:nowrap;
      box-shadow:0 4px 20px rgba(220,39,67,.3);
      transition:opacity .2s, transform .15s;
    }
    .fetch-btn:hover:not(:disabled) { opacity:.9; transform:translateY(-1px); }
    .fetch-btn:disabled { opacity:.4; cursor:not-allowed; transform:none; }

    .status-box {
      display:none; margin-top:18px;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08);
      border-radius:14px; padding:18px 20px;
      font-family:'DM Sans',sans-serif; font-size:14px;
      animation: fadeUp .35s ease;
    }
    .status-box.show { display:block; }
    .status-box.error { background:rgba(255,60,60,.08); border-color:rgba(255,60,60,.2); color:#ff9090; }
    .status-box.success { background:rgba(30,200,100,.07); border-color:rgba(30,200,100,.18); color:#7dffb3; }

    .progress-bar-wrap { height:4px; background:rgba(255,255,255,.08); border-radius:4px; margin-top:10px; overflow:hidden; }
    .progress-bar {
      height:4px; width:0%;
      background: linear-gradient(90deg,#f09433,#dc2743,#bc1888);
      border-radius:4px; transition:width .3s ease;
    }

    .video-wrap {
      display:none; margin-top:18px;
      border-radius:16px; overflow:hidden;
      border:1px solid rgba(255,255,255,.1);
      animation: fadeUp .4s ease;
      background:#000;
    }
    .video-wrap.show { display:block; }
    .video-wrap video { width:100%; display:block; max-height:360px; }

    .meta { display:none; margin-top:14px; animation: fadeUp .4s ease .1s both; }
    .meta.show { display:block; }
    .meta-title { font-size:13px; color:rgba(255,255,255,.5); font-family:'DM Sans',sans-serif; line-height:1.5; margin-bottom:14px; }

    .dl-btn {
      width:100%; padding:17px;
      background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
      border:none; border-radius:12px; color:#fff;
      font-family:'Sora',sans-serif; font-weight:700; font-size:15px;
      cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px;
      box-shadow:0 6px 28px rgba(220,39,67,.35);
      transition:opacity .2s, transform .15s;
    }
    .dl-btn:hover:not(:disabled) { opacity:.92; transform:translateY(-1px); }
    .dl-btn:disabled { opacity:.5; cursor:not-allowed; }

    .reset-btn {
      background:transparent; border:none; color:rgba(255,255,255,.3);
      font-size:13px; cursor:pointer; text-decoration:underline;
      font-family:'DM Sans',sans-serif; margin-top:12px;
      display:block; width:100%; text-align:center; transition:color .2s;
    }
    .reset-btn:hover { color:rgba(255,255,255,.6); }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .spin {
      display:inline-block; width:16px; height:16px;
      border:2px solid rgba(255,255,255,.25); border-top-color:#fff;
      border-radius:50%; animation:spinr .7s linear infinite; vertical-align:middle; margin-right:6px;
    }
    @keyframes spinr { to { transform:rotate(360deg); } }

    .footer { margin-top:28px; text-align:center; color:rgba(255,255,255,.15); font-size:12px; font-family:'DM Sans',sans-serif; line-height:1.8; }

    @media(max-width:480px){
      .card { padding:26px 18px; }
      .input-row { flex-direction:column; }
      .fetch-btn { width:100%; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="ig-logo">📸</div>
  <div>
    <h1>IG Video Downloader</h1>
    <p>Direct download — no redirects, runs in your browser</p>
  </div>
</div>

<div class="card">
  <div class="label">Paste Instagram Link</div>
  <div class="input-row">
    <input type="text" id="urlInput" placeholder="https://www.instagram.com/reel/..." autocomplete="off" spellcheck="false" />
    <button class="fetch-btn" id="fetchBtn">Fetch →</button>
  </div>

  <div class="status-box" id="statusBox"></div>

  <div class="video-wrap" id="videoWrap">
    <video id="videoEl" controls playsinline preload="metadata"></video>
  </div>

  <div class="meta" id="meta">
    <div class="meta-title" id="metaTitle"></div>
    <button class="dl-btn" id="dlBtn">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
      </svg>
      Download Video (MP4)
    </button>
    <button class="reset-btn" id="resetBtn">↩ Try another link</button>
  </div>
</div>

<div class="footer">
  Works with public Instagram posts, reels &amp; IGTV.<br/>
  No login required &middot; No data stored &middot; 100% browser-based.
</div>

<script>
  const urlInput  = document.getElementById('urlInput');
  const fetchBtn  = document.getElementById('fetchBtn');
  const statusBox = document.getElementById('statusBox');
  const videoWrap = document.getElementById('videoWrap');
  const videoEl   = document.getElementById('videoEl');
  const metaEl    = document.getElementById('meta');
  const metaTitle = document.getElementById('metaTitle');
  const dlBtn     = document.getElementById('dlBtn');
  const resetBtn  = document.getElementById('resetBtn');

  let currentVideoUrl = '';
  let currentFilename = 'instagram_video.mp4';

  // CORS proxies tried in order
  const PROXIES = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${encodeURIComponent(u)}`,
  ];

  // ── UI helpers ──
  function setStatus(html, type = 'loading') {
    statusBox.className = `status-box show ${type}`;
    statusBox.innerHTML = html;
    if (type === 'loading') {
      statusBox.innerHTML += `<div class="progress-bar-wrap"><div class="progress-bar" id="pbar"></div></div>`;
      animBar();
    }
  }
  function animBar() {
    let w = 0;
    const iv = setInterval(() => {
      const bar = document.getElementById('pbar');
      if (!bar) { clearInterval(iv); return; }
      w = Math.min(w + Math.random() * 15, 82);
      bar.style.width = w + '%';
      if (w >= 82) clearInterval(iv);
    }, 200);
  }
  function completeBar() {
    const bar = document.getElementById('pbar');
    if (bar) bar.style.width = '100%';
  }

  // ── Decode HTML entities & escaped unicode ──
  function decode(s) {
    return s
      .replace(/\\u0026/g,'&').replace(/\\u003C/g,'<').replace(/\\u003E/g,'>')
      .replace(/\\u003D/g,'=').replace(/\\n/g,'').replace(/\\\//g,'/')
      .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  }

  // ── Extract video URL from raw HTML ──
  function extractVideo(html) {
    const patterns = [
      // og:video:secure_url
      /<meta[^>]+property=["']og:video:secure_url["'][^>]+content=["']([^"']+\.mp4[^"']*)["']/i,
      /<meta[^>]+content=["']([^"']+\.mp4[^"']*)["'][^>]+property=["']og:video:secure_url["']/i,
      // og:video
      /<meta[^>]+property=["']og:video["'][^>]+content=["']([^"']+\.mp4[^"']*)["']/i,
      /<meta[^>]+content=["']([^"']+\.mp4[^"']*)["'][^>]+property=["']og:video["']/i,
      // JSON video_url
      /"video_url"\s*:\s*"([^"]+\.mp4[^"]*)"/,
      /"playback_url"\s*:\s*"([^"]+\.mp4[^"]*)"/,
      /"src"\s*:\s*"(https:\/\/[^"]+\.mp4[^"]*)"/,
      // fallback: any cdninstagram mp4
      /(https:\/\/[^"'\s]+cdninstagram[^"'\s]+\.mp4[^"'\s]*)/,
      /(https:\/\/[^"'\s]+\.mp4\?[^"'\s]*efg=[^"'\s]*)/,
    ];
    for (const p of patterns) {
      const m = html.match(p);
      if (m && m[1]) return decode(m[1]);
    }
    return null;
  }

  function extractTitle(html) {
    const m = html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i)
           || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i);
    return m ? decode(m[1]) : '';
  }

  // ── Fetch through proxies ──
  async function fetchHtml(targetUrl) {
    for (let i = 0; i < PROXIES.length; i++) {
      try {
        setStatus(`<span class="spin"></span> Trying proxy ${i + 1} of ${PROXIES.length}...`);
        const res = await fetch(PROXIES[i](targetUrl), {
          headers: { 'Accept': 'text/html,application/xhtml+xml' }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        if (text.length > 1000) return text;
      } catch (e) {
        // try next proxy
      }
    }
    return null;
  }

  // ── Main fetch flow ──
  async function fetchVideo() {
    const raw = urlInput.value.trim();
    if (!raw) return;

    if (!raw.includes('instagram.com')) {
      setStatus('⚠️ Please paste a valid Instagram URL.', 'error');
      return;
    }

    // Reset UI
    videoWrap.classList.remove('show');
    metaEl.classList.remove('show');
    currentVideoUrl = '';
    videoEl.src = '';
    fetchBtn.disabled = true;

    setStatus('<span class="spin"></span> Connecting to Instagram...');

    const html = await fetchHtml(raw);

    if (!html) {
      fetchBtn.disabled = false;
      setStatus('❌ Could not reach Instagram through any proxy. Try again in a moment — Instagram sometimes rate-limits requests.', 'error');
      return;
    }

    setStatus('<span class="spin"></span> Scanning for video data...');
    await new Promise(r => setTimeout(r, 300));

    const videoUrl = extractVideo(html);

    if (!videoUrl) {
      fetchBtn.disabled = false;
      setStatus([
        '❌ No video found in this post.',
        '<br><small style="opacity:.65;font-size:12px">Possible reasons: private account, photo-only post, story (stories can\'t be extracted), or Instagram blocked the data for logged-out users.</small>'
      ].join(''), 'error');
      return;
    }

    completeBar();
    currentVideoUrl = videoUrl;

    const sc = raw.match(/\/(?:p|reel|tv)\/([A-Za-z0-9_\-]+)/);
    currentFilename = `instagram_${sc ? sc[1] : Date.now()}.mp4`;

    const title = extractTitle(html);
    metaTitle.textContent = title ? `📌 ${title}` : `📌 ${currentFilename}`;

    setStatus('✅ Video found! Preview below.', 'success');

    videoEl.src = videoUrl;
    videoWrap.classList.add('show');
    metaEl.classList.add('show');

    fetchBtn.disabled = false;
  }

  // ── Download ──
  dlBtn.addEventListener('click', async () => {
    if (!currentVideoUrl) return;
    dlBtn.disabled = true;
    dlBtn.innerHTML = `<span class="spin"></span> Downloading...`;

    let saved = false;

    // Try fetching as blob through proxies first
    for (const proxy of PROXIES) {
      try {
        const res = await fetch(proxy(currentVideoUrl));
        if (!res.ok) throw new Error('bad');
        const blob = await res.blob();
        const bUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = bUrl; a.download = currentFilename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(bUrl), 8000);
        saved = true;
        break;
      } catch { /* next */ }
    }

    if (!saved) {
      // Fallback: open direct URL
      const a = document.createElement('a');
      a.href = currentVideoUrl;
      a.download = currentFilename;
      a.target = '_blank';
      document.body.appendChild(a); a.click(); a.remove();
    }

    dlBtn.disabled = false;
    dlBtn.innerHTML = `
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/>
      </svg>
      Download Video (MP4)`;
  });

  fetchBtn.addEventListener('click', fetchVideo);
  urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') fetchVideo(); });
  resetBtn.addEventListener('click', () => {
    urlInput.value = '';
    statusBox.className = 'status-box';
    videoWrap.classList.remove('show');
    metaEl.classList.remove('show');
    videoEl.src = '';
    currentVideoUrl = '';
    urlInput.focus();
  });
</script>
</body>
</html>
